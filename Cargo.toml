[package]
name = "planvil"
version = "0.1.0"
edition = "2024"
description = "Enforced feature workflow for Claude Code: stage gates, recorded verification, bounded repair loops"
license = "MIT"
repository = "https://github.com/benpsk/planvil"
homepage = "https://github.com/benpsk/planvil"
readme = "README.md"
keywords = ["claude-code", "workflow", "hooks", "verification"]
categories = ["command-line-utilities", "development-tools"]
# std File::try_lock
rust-version = "1.89"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
